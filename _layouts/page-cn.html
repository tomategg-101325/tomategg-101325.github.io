<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- HEADER with navigation -->
  <header>
    <div class="site-branding">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
    <nav>
      <ul>
        <!-- Add or remove pages as needed -->
        <li><a href="{{ '/' | relative_url }}">主页</a></li>
        <li><a href="{{ '/about/' | relative_url }}">关于</a></li>
        <li><a href="{{ '/en/' | relative_url }}">🇬🇧 English</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT (fill this in per page) -->
  <main>
    {{ content }}
  </main>

  <!-- FOOTER with site name & description -->
  <footer>
    <p>{{ site.description }}</p>
    <p>&copy; {{ site.time | date: "%Y-%m" }} {{ site.title }}。所有权利保留。</p>
  </footer>
</body>
</html>
